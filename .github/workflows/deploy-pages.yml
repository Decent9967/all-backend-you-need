name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 静态导出并部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 项目站挂在 /all-backend-you-need 子路径下，注入 basePath 并静态导出
      - name: 构建（静态导出）
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /all-backend-you-need
          NEXT_EXPORT: "1"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v5
